<style>
/* Layout: one 480px column, three stacked screens (week, day, exercise) plus a calendar, fixed two-tab bar at the bottom. */
:root {
  --bg: #F1F3F6; --surface: #FFFFFF; --panel: #F6F7F9; --ink: #141821; --muted: #5B6373; --line: #DCE0E7;
  --hot: #FF6A13; --hot2: #FFC08F; --hot-ink: #B8420A; --hot-soft: #FFEEE2;
  --good: #177F4E; --good-soft: #E2F3EA; --bad: #BE2A4A; --bad-soft: #FBE6EB; --move: #2747E0;
  --fig: #F4F5F8; --fig-far: #D9DEE6; --fig-line: #69717F; --gear: #3B4352; --gear-pad: #9AA2B1; --on-ink: #FFFFFF;
  --display: 'Barlow Condensed', 'Arial Narrow', 'Roboto Condensed', system-ui, sans-serif;
  --body: 'Barlow', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1016; --surface: #171B24; --panel: #1E232E; --ink: #EDF0F5; --muted: #9AA3B4; --line: #2A303C;
    --hot: #FF7A2B; --hot2: #A35A30; --hot-ink: #FF9D66; --hot-soft: #3A2416;
    --good: #5CCB95; --good-soft: #12301F; --bad: #FF8AA0; --bad-soft: #3A1620; --move: #8EA4FF;
    --fig: #3B4352; --fig-far: #2A313D; --fig-line: #B3BCCB; --gear: #C9D0DC; --gear-pad: #5E6676; --on-ink: #0D1016;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1016; --surface: #171B24; --panel: #1E232E; --ink: #EDF0F5; --muted: #9AA3B4; --line: #2A303C;
  --hot: #FF7A2B; --hot2: #A35A30; --hot-ink: #FF9D66; --hot-soft: #3A2416;
  --good: #5CCB95; --good-soft: #12301F; --bad: #FF8AA0; --bad-soft: #3A1620; --move: #8EA4FF;
  --fig: #3B4352; --fig-far: #2A313D; --fig-line: #B3BCCB; --gear: #C9D0DC; --gear-pad: #5E6676; --on-ink: #0D1016;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.4; -webkit-text-size-adjust: 100%; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; -webkit-tap-highlight-color: transparent; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--move); outline-offset: 2px; border-radius: 8px; }
h1, h2, h3, p, ul, ol { margin: 0; padding: 0; }
ul, ol { list-style: none; }
.wrap { max-width: 480px; margin-inline: auto; padding-inline: 16px; padding-block: 14px 104px; display: flex; flex-direction: column; gap: 18px; }

/* figures */
.fig { display: block; width: 100%; height: auto; }
.fb { fill: var(--fig); stroke: var(--fig-line); stroke-width: 1.15; }
.ff { fill: var(--fig-far); stroke: var(--fig-line); stroke-width: 1.15; }
.hl { stroke-linecap: round; fill: none; }
.hl.h1 { stroke: var(--hot); } .hl.h2 { stroke: var(--hot2); }
.hf.h1 { fill: var(--hot); stroke: none; } .hf.h2 { fill: var(--hot2); stroke: none; }
.gl { stroke: var(--gear); stroke-linecap: round; } .gs { stroke-linecap: butt; }
.gpad { stroke: var(--gear-pad); stroke-linecap: round; }
.gp { fill: var(--gear); fill-opacity: .82; stroke: var(--gear); } .gd { fill: var(--gear); }
.gc { stroke: var(--gear); } .gb { stroke-dasharray: 3 2.5; }
.gpadc { fill: var(--gear-pad); } .gball { fill: var(--fig-far); stroke: var(--gear-pad); } .gbox { fill: var(--gear-pad); }
.fl { stroke: var(--line); stroke-width: 1.4; }
.ar { stroke: var(--move); stroke-linecap: round; } .arh { fill: var(--move); }

/* type */
.eyebrow { font-family: var(--display); font-weight: 600; font-size: 15px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
h1 { font-family: var(--display); font-weight: 700; font-size: 34px; line-height: 1.04; letter-spacing: .005em; text-wrap: balance; }
h2 { font-family: var(--display); font-weight: 700; font-size: 22px; line-height: 1.1; letter-spacing: .01em; }
.sub { color: var(--muted); font-size: 14px; }
.num { font-variant-numeric: tabular-nums; }

/* top bar */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 40px; }
.back { display: inline-flex; align-items: center; gap: 4px; font-weight: 600; font-size: 15px; padding: 8px 12px 8px 6px; margin-left: -6px; border-radius: 10px; color: var(--ink); }
.back svg, .chev { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.pill { font-size: 13px; font-weight: 600; padding: 7px 12px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); white-space: nowrap; }
.head { display: flex; flex-direction: column; gap: 4px; }

/* week strip */
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.wk { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0 7px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); min-width: 0; }
.wk .l { font-family: var(--display); font-weight: 600; font-size: 13px; letter-spacing: .08em; color: var(--muted); }
.wk .d { font-weight: 600; font-size: 15px; font-variant-numeric: tabular-nums; }
.wk .m { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; }
.wk .m svg { width: 11px; height: 11px; fill: none; stroke: var(--on-ink); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; visibility: hidden; }
.wk.done .m { background: var(--good); border-color: var(--good); } .wk.done .m svg { visibility: visible; }
.wk.now { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }

/* today card */
.today { display: grid; grid-template-columns: 1fr 104px; align-items: center; gap: 8px; width: 100%; background: var(--ink); color: var(--on-ink); border-radius: 18px; padding: 16px 12px 16px 18px; }
.today .eyebrow { color: var(--on-ink); opacity: .7; }
.today .nm { font-family: var(--display); font-weight: 700; font-size: 30px; line-height: 1.05; margin-top: 2px; }
.today .go { display: inline-flex; align-items: center; gap: 4px; margin-top: 10px; font-weight: 600; font-size: 15px; }
.today .pic { background: var(--panel); border-radius: 12px; padding: 4px; }
.today.rest { grid-template-columns: 1fr; background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
.today.rest .eyebrow { color: var(--muted); opacity: 1; }

/* lists */
.list { display: flex; flex-direction: column; gap: 8px; }
.row { display: grid; align-items: center; gap: 12px; width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 10px 10px 12px; min-width: 0; }
.row.day { grid-template-columns: 50px minmax(0, 1fr) 18px; padding-block: 12px; }
.row.ex { grid-template-columns: 62px minmax(0, 1fr) 18px; padding: 8px 10px 8px 8px; }
.row .chev { color: var(--muted); }
.dtag { font-family: var(--display); font-weight: 700; font-size: 20px; letter-spacing: .06em; text-transform: uppercase; }
.rt { font-weight: 600; font-size: 16px; line-height: 1.25; overflow-wrap: anywhere; }
.rm { color: var(--muted); font-size: 13.5px; margin-top: 2px; }
.rm b { color: var(--hot-ink); font-weight: 600; }
.ok { color: var(--good); font-weight: 600; }
.th { display: block; width: 62px; aspect-ratio: 1; background: var(--panel); border-radius: 10px; overflow: hidden; }

/* day screen */
.logbtn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 48px; border-radius: 14px; background: var(--ink); color: var(--on-ink); font-weight: 600; font-size: 16px; text-align: center; padding: 10px 14px; }
.logbtn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.logbtn.done { background: var(--good-soft); color: var(--good); }
.logged { display: flex; align-items: center; gap: 10px; }
.logged .logbtn { flex: 1; }
.undo { font-weight: 600; font-size: 14px; color: var(--muted); padding: 12px 8px; text-decoration: underline; text-underline-offset: 3px; }

/* exercise screen */

<script>
/* Mannequin figure engine. Two rigs: side view ('s') and front/back view ('f','b').
   Angles: 0 = pointing down, 90 = forward (right), 180 = up, 270 = backward. Floor at y = 186. */
const FIG = (() => {
  const R = d => d * Math.PI / 180, D = r => r * 180 / Math.PI;
  const dir = a => [Math.sin(R(a)), Math.cos(R(a))];
  const add = (p, v, s = 1) => [p[0] + v[0] * s, p[1] + v[1] * s];
  const mix = (a, b, t) => a + (b - a) * t;
  const mixP = (a, b, t) => [mix(a[0], b[0], t), mix(a[1], b[1], t)];
  const f = n => (Math.round(n * 10) / 10).toString();
  const LEN = { lt: 20, ut: 24, ua: 27, fa: 24, th: 37, sh: 35 };
  const FLOOR = 186;

  function ik(Rt, T, l1, l2, bend) {
    const dx = T[0] - Rt[0], dy = T[1] - Rt[1];
    let d = Math.hypot(dx, dy);
    d = Math.max(Math.abs(l1 - l2) + .01, Math.min(l1 + l2 - .01, d));
    const th = Math.atan2(dx, dy);
    const al = Math.acos((l1 * l1 + d * d - l2 * l2) / (2 * l1 * d));
    const a1 = th + bend * al;
    const E = [Rt[0] + l1 * Math.sin(a1), Rt[1] + l1 * Math.cos(a1)];
    const Tc = [Rt[0] + d * Math.sin(th), Rt[1] + d * Math.cos(th)];
    return [D(a1), D(Math.atan2(Tc[0] - E[0], Tc[1] - E[1]))];
  }
  const short = (a, b, t) => a + ((((b - a) % 360) + 540) % 360 - 180) * t;

  /* ---------- drawing primitives ---------- */
  function cap(A, B, ra, rb, cls) {
    const dx = B[0] - A[0], dy = B[1] - A[1], d = Math.hypot(dx, dy) || .001;
    const nx = -dy / d, ny = dx / d;
    const p = (P, r, s) => f(P[0] + nx * r * s) + ' ' + f(P[1] + ny * r * s);
    return `<path class="${cls}" d="M${p(A, ra, 1)}L${p(B, rb, 1)}A${rb} ${rb} 0 0 0 ${p(B, rb, -1)}L${p(A, ra, -1)}A${ra} ${ra} 0 0 0 ${p(A, ra, 1)}Z"/>`;
  }
  const circ = (P, r, cls) => `<circle class="${cls}" cx="${f(P[0])}" cy="${f(P[1])}" r="${r}"/>`;
  const line = (A, B, w, cls) => `<line class="${cls}" x1="${f(A[0])}" y1="${f(A[1])}" x2="${f(B[0])}" y2="${f(B[1])}" stroke-width="${w}"/>`;
  /* highlight band along a segment: nrm = unit normal toward the wanted side, r = local radius */
  function band(A, B, nrm, r, from, to, cls, wide) {
    const P = t => add(mixP(A, B, t), nrm, r * (wide ? 0 : .34));
    return line(P(from), P(to), f(r * (wide ? 1.3 : 1.02)), 'hl ' + cls);
  }
  function arrow(P0, P1, off, away) {
    const dx = P1[0] - P0[0], dy = P1[1] - P0[1], d = Math.hypot(dx, dy);
    if (d < 9) return '';
    const ux = dx / d, uy = dy / d; let nx = -uy, ny = ux;
    const M = mixP(P0, P1, .5);
    if (away && Math.hypot(M[0] + nx * off - away[0], M[1] + ny * off - away[1]) < Math.hypot(M[0] - nx * off - away[0], M[1] - ny * off - away[1])) { nx = -nx; ny = -ny; }
    const A = [P0[0] + ux * d * .12 + nx * off, P0[1] + uy * d * .12 + ny * off];
    const B = [P0[0] + ux * d * .88 + nx * off, P0[1] + uy * d * .88 + ny * off];
    const h = 6.5;
    const b1 = [B[0] - ux * h + nx * h * .58, B[1] - uy * h + ny * h * .58];
    const b2 = [B[0] - ux * h - nx * h * .58, B[1] - uy * h - ny * h * .58];
    return line(A, [B[0] - ux * 4, B[1] - uy * 4], 2.6, 'ar') +
      `<path class="arh" d="M${f(B[0])} ${f(B[1])}L${f(b1[0])} ${f(b1[1])}L${f(b2[0])} ${f(b2[1])}Z"/>`;
  }

  /* ---------- side rig ---------- */
  const SDEF = { hip: [100, 110], torso: 180, curl: 0, head: 0, aN: [0, 0], lN: [0, 0], ftN: 90, ak: [1, 1] };
  function limbAngles(spec, root, l1, l2, defBend, up) {
    if (Array.isArray(spec)) return { ang: spec };
    if (spec.r) return { ang: [spec.r[0] + up - 180, spec.r[1] + up - 180] };
    const T = spec.h || spec.f, b = spec.b == null ? defBend : spec.b;
    return { ang: ik(root, T, l1, l2, b), ikT: T, bend: b };
  }
  function solveSide(P0) {
    const P = Object.assign({}, SDEF, P0);
    if (!P.aF) P.aF = P.aN; if (!P.lF) P.lF = P.lN; if (P.ftF == null) P.ftF = P.ftN;
    const J = { hip: P.hip, torso: P.torso, curl: P.curl, ak: P.ak };
    const up = P.torso - P.curl;
    J.mid = add(P.hip, dir(P.torso), LEN.lt);
    J.sh = add(J.mid, dir(up), LEN.ut);
    J.headDir = up - P.head;
    for (const s of ['N', 'F']) {
      J['a' + s] = limbAngles(P['a' + s], J.sh, LEN.ua * P.ak[0], LEN.fa * P.ak[1], -1, up);
      J['l' + s] = limbAngles(P['l' + s], P.hip, LEN.th, LEN.sh, 1, up);
      J['ft' + s] = P['ft' + s];
    }
    return J;
  }
  function limbMix(a, b, t, root, l1, l2) {
    if (a.ikT && b.ikT && a.bend === b.bend) return ik(root, mixP(a.ikT, b.ikT, t), l1, l2, a.bend);
    if (a.ikT || b.ikT) return [short(a.ang[0], b.ang[0], t), short(a.ang[1], b.ang[1], t)];
    return [mix(a.ang[0], b.ang[0], t), mix(a.ang[1], b.ang[1], t)];
  }
  function sideJoints(A, B, t) {
    const JA = solveSide(A), JB = solveSide(B), J = {};
    J.hip = mixP(JA.hip, JB.hip, t);
    J.torso = mix(JA.torso, JB.torso, t); J.curl = mix(JA.curl, JB.curl, t);
    J.upDir = J.torso - J.curl; J.headDir = mix(JA.headDir, JB.headDir, t);
    J.mid = add(J.hip, dir(J.torso), LEN.lt);
    J.sh = add(J.mid, dir(J.upDir), LEN.ut);
    J.neck = add(J.sh, dir(J.upDir), 4);
    J.head = add(J.neck, dir(J.headDir), 13.5);
    const k1 = mix(JA.ak[0], JB.ak[0], t), k2 = mix(JA.ak[1], JB.ak[1], t);
    for (const s of ['N', 'F']) {
      const a = limbMix(JA['a' + s], JB['a' + s], t, J.sh, LEN.ua * k1, LEN.fa * k2);
      J['ua' + s] = a[0]; J['fa' + s] = a[1];
      J['e' + s] = add(J.sh, dir(a[0]), LEN.ua * k1);
      J['w' + s] = add(J['e' + s], dir(a[1]), LEN.fa * k2);
      J['h' + s] = add(J['w' + s], dir(a[1]), 3);
      const l = limbMix(JA['l' + s], JB['l' + s], t, J.hip, LEN.th, LEN.sh);
      J['th' + s] = l[0]; J['shn' + s] = l[1];
      J['k' + s] = add(J.hip, dir(l[0]), LEN.th);
      J['an' + s] = add(J['k' + s], dir(l[1]), LEN.sh);
      J['fd' + s] = mix(JA['ft' + s], JB['ft' + s], t);
      J['toe' + s] = add(J['an' + s], dir(J['fd' + s]), 11.5);
      J['sf' + s] = add(add(J['an' + s], dir(l[1] + 90), 8.5), dir(l[1]), -5);
      J['sb' + s] = add(add(J['an' + s], dir(l[1] - 90), 8.5), dir(l[1]), -5);
    }
    return J;
  }
  function drawSide(J, H, eq) {
    const hot = k => H.p.includes(k) ? 'h1' : H.s.includes(k) ? 'h2' : null;
    const neg = v => [-v[0], -v[1]];
    const arm = (s, cls) => {
      const S = J.sh, E = J['e' + s], W = J['w' + s];
      let x = cap(S, E, 6, 4.9, cls) + cap(E, W, 4.7, 3.3, cls) + circ(J['h' + s], 3.7, cls);
      const nu = dir(J['ua' + s] + 90), nf = dir(J['fa' + s] + 90);
      let c;
      if ((c = hot('biceps'))) x += band(S, E, nu, 5.3, .24, .8, c);
      if ((c = hot('triceps'))) x += band(S, E, neg(nu), 5.3, .2, .8, c);
      if ((c = hot('forearms'))) x += band(E, W, nf, 3.6, .14, .66, c, true);
      if (s === 'N') {
        if ((c = hot('delts'))) x += circ(add(S, dir(J.upDir - 90), 1), 6, 'hl hf ' + c);
        if ((c = hot('rdelts'))) x += circ(add(S, dir(J.upDir + 90), 2.4), 5.6, 'hl hf ' + c);
      }
      return x;
    };
    const leg = (s, cls) => {
      const Hp = J.hip, K = J['k' + s], A = J['an' + s];
      const fdir = J['fd' + s], sole = dir(fdir - 90);
      let x = cap(Hp, K, 9.3, 6.4, cls) + cap(K, A, 6.1, 3.8, cls) +
        cap(add(A, sole, 1.2), add(add(A, dir(fdir), 11.5), sole, 2), 3.5, 2.5, cls);
      const nt = dir(J['th' + s] + 90), ns = dir(J['shn' + s] + 90);
      let c;
      if ((c = hot('quads'))) x += band(Hp, K, nt, 7.6, .2, .84, c);
      if ((c = hot('hams'))) x += band(Hp, K, neg(nt), 7.6, .26, .84, c);
      if ((c = hot('calves'))) x += band(K, A, neg(ns), 5.2, .1, .56, c);
      return x;
    };
    const torso = () => {
      const nl = dir(J.torso - 90), nu = dir(J.upDir - 90);   /* front normals */
      let x = cap(J.hip, J.mid, 10, 8.9, 'fb') + cap(J.mid, J.sh, 8.9, 11, 'fb');
      x += cap(J.sh, add(J.neck, dir(J.headDir), 4), 4, 3.7, 'fb');
      x += `<ellipse class="fb" cx="${f(J.head[0])}" cy="${f(J.head[1])}" rx="8" ry="9.8" transform="rotate(${f(180 - J.headDir)} ${f(J.head[0])} ${f(J.head[1])})"/>`;
      let c;
      if ((c = hot('abs'))) x += band(J.hip, J.mid, nl, 8.8, .3, 1.1, c);
      if ((c = hot('lowback'))) x += band(J.hip, J.mid, neg(nl), 8.8, .3, 1.05, c);
      if ((c = hot('glutes'))) x += circ(add(J.hip, neg(nl), 4.4), 6.6, 'hl hf ' + c);
      const cu = hot('chestU'), cl = hot('chestL');
      if (cl) x += band(J.mid, J.sh, nu, 10, .34, .68, cl);
      if (cu) x += band(J.mid, J.sh, nu, 10, cl ? .62 : .5, .88, cu);
      if ((c = hot('lats'))) x += band(J.mid, J.sh, neg(nu), 9.8, .06, .6, c);
      if ((c = hot('midback'))) x += band(J.mid, J.sh, neg(nu), 10, .46, .84, c);
      if ((c = hot('traps'))) x += band(J.mid, J.sh, neg(nu), 10, .8, 1.04, c);
      return x;
    };
    return drawEq(eq, J, 'b') + leg('F', 'ff') + arm('F', 'ff') + drawEq(eq, J, 'm') +
      torso() + leg('N', 'fb') + arm('N', 'fb') + drawEq(eq, J, 'f');
  }

  /* ---------- front / back rig ---------- */
  const FDEF = { hip: [100, 110], ts: 1, hd: 0, aR: [8, 4, 1, 1], lR: [3, 0, 1, 1] };
  function frontJoints(A0, B0, t) {
    const A = Object.assign({}, FDEF, A0), B = Object.assign({}, FDEF, B0);
    for (const P of [A, B]) { if (!P.aL) P.aL = P.aR; if (!P.lL) P.lL = P.lR; }
    const J = {};
    const m4 = (a, b) => [0, 1, 2, 3].map(i => mix(a[i] == null ? 1 : a[i], b[i] == null ? 1 : b[i], t));

  'db-rdl': { n:'Dumbbell Romanian Deadlift', g:'Dumbbells', c:['Stand tall, dumbbells at your thighs','Push hips back, lower to mid-shin'] },
  'smith-rdl': { n:'Smith Machine Romanian Deadlift', g:'Smith machine', c:['Stand tall, bar at your thighs','Push hips back, bar close to your legs'] },
  'back-extension': { n:'Back Extension', g:'Hyperextension bench', r:'12–15', c:['Hips on the pad, body in a straight line','Bend at the hips, then lift back up'] },
  'standing-leg-curl': { n:'Standing Leg Curl', g:'Standing leg curl machine', e:'leg', c:['One leg straight, pad above the heel','Curl the heel up toward your glutes'] },
  'ball-leg-curl': { n:'Stability Ball Leg Curl', g:'Exercise ball, mat', c:['Heels on the ball, hips lifted','Roll the ball in toward your glutes'] },
  'machine-preacher': { n:'Machine Preacher Curl', g:'Preacher curl machine', c:['Arms on the pad, nearly straight','Curl the handles up to your shoulders'] },
  'spider-curl': { n:'Spider Curl', g:'EZ bar, incline or preacher bench', c:['Chest on the pad, arms hanging straight','Curl up, elbows stay still'] },
  'concentration-curl': { n:'Concentration Curl', g:'One dumbbell, bench', e:'arm', c:['Elbow braced inside your thigh','Curl up to your shoulder'] },
};

const PLAN = [
  { k:'mon', day:'Monday', name:'Chest + Triceps', code:'CH·TR', ex:[['bench-press',4,'8–10'],['incline-db-press',3,'10–12'],['machine-press',3,'10–12'],['cable-crossover',3,'12–15'],['rope-pushdown',3,'12'],['oh-db-ext',3,'12'],['assisted-dips',2,'10–12']] },
  { k:'tue', day:'Tuesday', name:'Back + Biceps', code:'BK·BI', ex:[['lat-pulldown',4,'10–12'],['seated-cable-row',3,'10–12'],['chest-supported-row',3,'10'],['straight-arm-pulldown',3,'12–15'],['ez-curl',3,'10–12'],['incline-db-curl',3,'10–12'],['hammer-curl',2,'12']] },
  { k:'wed', day:'Wednesday', name:'Shoulders + Abs', code:'SH·AB', ex:[['db-shoulder-press',3,'8–10'],['lateral-raise',4,'12–15'],['rear-delt-fly',3,'12–15'],['cable-lateral',3,'12'],['face-pull',3,'15'],['cable-crunch',3,'15'],['reverse-crunch',3,'12–15'],['plank',3,'30–45']] },
  { k:'thu', day:'Thursday', name:'Quads + Calves', code:'QD·CF', ex:[['squat',4,'8–10'],['leg-press',3,'10–12'],['bulgarian',3,'10'],['leg-extension',3,'12–15'],['standing-calf',4,'15'],['seated-calf',3,'15–20']] },
  { k:'fri', day:'Friday', name:'Chest + Back', code:'CH·BK', ex:[['incline-bb-press',3,'8–10'],['flat-db-press',3,'10–12'],['pec-deck',3,'12–15'],['lat-pulldown',3,'10–12'],['one-arm-db-row',3,'10'],['seated-cable-row',3,'12'],['straight-arm-pulldown',2,'15']] },
  { k:'sat', day:'Saturday', name:'Hamstrings + Arms', code:'HM·AR', ex:[['rdl',3,'8–10'],['lying-leg-curl',3,'10–12'],['seated-leg-curl',3,'12–15'],['ez-curl',3,'10–12'],['preacher-curl',3,'12'],['rope-pushdown',3,'12'],['oh-cable-ext',3,'12']] },
];

</script>
<script>
(() => {
  const $ = s => document.querySelector(s);
  const app = $('#app');
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const MONL = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  const WD = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const dkey = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  const dparse = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
  const dshort = k => { const d = dparse(k); return d.getDate() + ' ' + MON[d.getMonth()]; };
  const dlong = k => { const d = dparse(k); return WD[d.getDay()] + ' ' + d.getDate() + ' ' + MON[d.getMonth()]; };
  const today = () => dkey(new Date());
  const dayByKey = k => PLAN.find(d => d.k === k);
  const I = {
    back: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>',
    chev: '<svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>',
    check: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
    cross: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>',
    play: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>',
    pause: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>',
  };

  /* ---------- gym log: saved to the viewer's private store when available, else to this browser ---------- */
  const LS = 'gymlog.v1', LSU = 'gymlog.unsynced.v1';
  const lsGet = k => { try { return JSON.parse(localStorage.getItem(k) || '{}') || {}; } catch (e) { return {}; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } };
  let view = 'fig';
  try { if (localStorage.getItem('gym.view') === 'photo') view = 'photo'; } catch (e) { }
  let log = lsGet(LS), unsynced = lsGet(LSU), docRef = null, cloud = false, saving = false, dirty = false, timer = null;
  function setLog(date, val) {
    if (val) log[date] = val; else delete log[date];
    unsynced[date] = val || null;
    lsSet(LS, log); lsSet(LSU, unsynced);
    dirty = true; if (docRef) { clearTimeout(timer); timer = setTimeout(flush, 350); }
    render();
  }
  async function flush() {
    if (saving || !docRef || !dirty) return;
    saving = true; dirty = false;
    const sent = JSON.stringify(unsynced);
    try {
      await docRef.set({ v: 1, days: Object.assign({}, log) });
      if (JSON.stringify(unsynced) === sent) { unsynced = {}; lsSet(LSU, unsynced); }
      cloud = true;
    } catch (e) {
      if (e && e.code === 'unavailable') dirty = true; else cloud = false;
    }
    saving = false;
    if (dirty && docRef) timer = setTimeout(flush, 2000);
    syncNote();
  }
  (async () => {
    try {
      if (!window.claude || !window.claude.use) return;
      const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      if (!db || !user) return;
      const uid = await user.id();
      if (!uid) return;
      docRef = db.doc('data/users/' + uid + '/gymlog');
      docRef.onSnapshot(snap => {
        if ((snap.metadata && snap.metadata.hasPendingWrites) || saving || dirty) return;
        const remote = snap.exists ? Object.assign({}, (snap.data() || {}).days || {}) : {};
        let changed = false;
        for (const k in unsynced) {
          if (unsynced[k] === null) { if (k in remote) { delete remote[k]; changed = true; } }
          else if (remote[k] !== unsynced[k]) { remote[k] = unsynced[k]; changed = true; }
        }
        log = remote; lsSet(LS, log); cloud = true;
        if (changed) { dirty = true; clearTimeout(timer); timer = setTimeout(flush, 350); }
        else { unsynced = {}; lsSet(LSU, unsynced); }
        render();
      }, () => { docRef = null; cloud = false; syncNote(); });
    } catch (e) { }
  })();
  function syncNote() {
    const el = $('#sync');
    if (el) el.textContent = cloud ? 'Saved to your account. It shows up on any device where you open this app.' : 'Saved on this device.';
  }

  /* ---------- helpers ---------- */
  const info = k => EX[k] || ALT[k];
  const muscles = (k, parent) => { const e = EX[k] || EX[parent]; return { p: e.p, s: e.s }; };
  const fig = (k, t, parent, opt) => FIG.svg(POSE[k], t, muscles(k, parent), opt);
  const FRONT = ['chestU', 'chestL', 'abs', 'biceps', 'quads', 'delts', 'forearms'];
  const STAND = { f: { v: 'f', arrow: false }, b: { v: 'b', arrow: false } };
  function bodyMaps(H) {
    const all = H.p.concat(H.s);
    const front = all.some(m => FRONT.includes(m)), back = all.some(m => !FRONT.includes(m));
    let o = '';
    if (front || !back) o += `<figure>${FIG.svg(STAND.f, 0, H)}Front</figure>`;
    if (back) o += `<figure>${FIG.svg(STAND.b, 0, H)}Back</figure>`;
    return o;
  }
  function rxOf(k, sets, reps, parentKind) {
    const e = info(k);
    const kind = e.kind || parentKind || 'i';
    const r = e.r || reps, each = e.e ? ' each ' + e.e : '';
    return { kind, sets, r, each, html: kind === 'h' ? `<b>${sets}</b> holds × <b>${r}</b> seconds${each}` : `<b>${sets}</b> sets × <b>${r}</b> reps${each}` };
  }
  const NOTES = {
    c: ['Find a weight where the last 2 reps are hard', 'Same weight. Keep 1–2 reps in reserve', 'Last set. Push to your limit, form stays clean'],
    i: ['Start lighter than you think and feel the muscle', 'Same weight. Take 2–3 seconds on the way down', 'Last set. Stop when your form breaks'],
    h: ['Lock in perfect form first', 'Same position. Breathe steadily', 'Last hold. Stop when your hips drop'],
  };
  const REST = { c: '90–120 seconds', i: '60 seconds', h: '45 seconds' };
  function setsHTML(rx, first) {
    const unit = rx.kind === 'h' ? ' s' : ' reps';
    let o = '';
    if (first) o += `<li class="warm"><span class="sn">Warm-up</span><span><span class="sr">1–2 light sets</span><br><span class="st">10–12 easy reps before set 1</span></span></li>`;
    for (let i = 0; i < rx.sets; i++) {
      const n = NOTES[rx.kind][i === 0 ? 0 : i === rx.sets - 1 ? 2 : 1];
      o += `<li><span class="sn">Set ${i + 1}</span><span><span class="sr">${rx.r}${unit}${rx.each}</span><br><span class="st">${n}</span></span></li>`;
    }
    const hi = String(rx.r).split('–').pop();
    const prog = rx.kind === 'h' ? `Every hold at ${hi} s? Add 10 seconds next week.` : `Every set at ${hi} reps? Add a little weight next time.`;
    return `<ol class="sets">${o}</ol><p class="restline"><b>Rest ${REST[rx.kind]}</b> between sets. ${prog}</p>`;
  }
  function lastDone(k) {
    let best = null;
    for (const d in log) if (log[d] === k && (!best || d > best)) best = d;
    return best;
  }
  function weekDates() {
    const now = new Date(), off = (now.getDay() + 6) % 7, out = [];
    for (let i = 0; i < 7; i++) out.push(dkey(new Date(now.getFullYear(), now.getMonth(), now.getDate() - off + i)));
    return out;
  }

  /* ---------- screens ---------- */
  function home() {
    const now = new Date(), t = today(), wk = weekDates();
    const plan = PLAN[now.getDay() - 1];
    let o = `<header class="head"><div class="eyebrow">${dlong(t)}</div><h1>Gym Workout Plan</h1></header>`;
    o += `<div class="week">` + wk.map((d, i) => {
      const done = log[d] && dayByKey(log[d]);
      return `<button class="wk${done ? ' done' : ''}${d === t ? ' now' : ''}" data-cal="${d}" aria-label="${dlong(d)}${done ? ', ' + esc(done.name) : ', not logged'}"><span class="l">${'MTWTFSS'[i]}</span><span class="d">${dparse(d).getDate()}</span><span class="m">${I.check}</span></button>`;
    }).join('') + `</div>`;
    if (plan) {
      const done = log[t] === plan.k;
      o += `<button class="today" data-go="d-${plan.k}"><span><span class="eyebrow">Today's plan · ${plan.day}</span><div class="nm">${plan.name}</div><span class="go">${done ? 'Logged for today' : plan.ex.length + ' exercises'} ${I.chev}</span></span><span class="pic">${fig(plan.ex[0][0], 1)}</span></button>`;
    } else {
      o += `<div class="today rest"><span><span class="eyebrow">Today's plan · Sunday</span><div class="nm">Rest day</div><span class="sub">Missed a session this week? Pick it from the list.</span></span></div>`;
    }
    o += `<section class="sec"><h2>All workouts</h2><div class="list">` + PLAN.map(d => {
      const inWeek = wk.find(x => log[x] === d.k), last = lastDone(d.k);
      const meta = inWeek ? `<span class="ok">Done ${dlong(inWeek)}</span>` : last ? `Last done ${dshort(last)}` : `${d.ex.length} exercises`;
      return `<button class="row day" data-go="d-${d.k}"><span class="dtag">${d.day.slice(0, 3)}</span><span><div class="rt">${d.name}</div><div class="rm">${meta}</div></span>${I.chev}</button>`;
    }).join('') + `</div></section>`;
    o += `<p class="note">Form cues here are general guidance. Where your trainer tells you something different, follow your trainer. Photos: Free Exercise DB, public domain.</p>`;
    return o;
  }

  function dayScreen(k) {
    const d = dayByKey(k), t = today();
    let o = `<div class="top"><button class="back" data-go="plan">${I.back}Plan</button></div>`;
    o += `<header class="head"><div class="eyebrow">${d.day} · ${d.ex.length} exercises</div><h1>${d.name}</h1></header>`;
    if (log[t] === k) o += `<div class="logged"><div class="logbtn done">${I.check}Logged for today, ${dlong(t)}</div><button class="undo" data-log="">Undo</button></div>`;
    else o += `<button class="logbtn" data-log="${k}">${log[t] && dayByKey(log[t]) ? 'Log this for today instead of ' + esc(dayByKey(log[t]).name) : 'I did this workout today'}</button>`;
    o += `<ol class="list">` + d.ex.map(([key, sets, reps], i) => {
      const e = EX[key], rx = rxOf(key, sets, reps);
      const short = rx.kind === 'h' ? `${sets} × ${reps} s` : `${sets} × ${reps}${e.e ? ' each ' + e.e : ''}`;
      return `<li><button class="row ex" data-go="x-${k}-${i}"><span class="th">${fig(key, 1)}</span><span><div class="rt">${i + 1}. ${esc(e.n)}</div><div class="rm"><span class="num">${short}</span> · <b>${esc(e.t)}</b></div></span>${I.chev}</button></li>`;
    }).join('') + `</ol>`;
    return o;
  }

  function exScreen(k, i, ai) {
    const d = dayByKey(k), [pkey, sets, reps] = d.ex[i], P = EX[pkey];
    const isAlt = ai != null, key = isAlt ? P.alt[ai] : pkey, e = info(key);
    const own = EX[key], T = own || P, H = muscles(key, pkey);
    const rx = rxOf(key, sets, reps, P.kind);
    let o = `<div class="top"><button class="back" data-go="${isAlt ? `x-${k}-${i}` : `d-${k}`}">${I.back}${isAlt ? 'Back' : d.day}</button>` +
      (isAlt ? '' : `<button class="pill" data-scroll="alts">Equipment busy?</button>`) + `</div>`;
    if (isAlt) o += `<div class="swap">Instead of <b>${esc(P.n)}</b>. Same target, same sets.</div>`;
    o += `<header class="head"><div class="eyebrow">${isAlt ? 'Alternative' : `${d.day} · ${i + 1} of ${d.ex.length}`}</div><h1>${esc(e.n)}</h1><p class="rx">${rx.html}</p></header>`;
    o += `<p class="tgt"><span>Target</span>${esc(T.t)}</p>`;
    const photo = view === 'photo';
    const ph = (t, cls) => `<img${cls ? ` class="${cls}"` : ''} src="img/${key}-${'ab'[t]}.webp" alt="${esc(e.n)}, ${t ? 'finish' : 'start'} position" decoding="async"${cls === 'p1' ? ' hidden' : ''}>`;
    o += `<section class="stagebox" data-fig="${key}" data-parent="${pkey}">
      <div class="seg" role="group" aria-label="Picture type"><button data-view="fig"${photo ? '' : ' class="on"'} aria-pressed="${!photo}">Figure</button><button data-view="photo"${photo ? ' class="on"' : ''} aria-pressed="${photo}">Photo</button></div>
      <div class="stage${photo ? ' ph' : ''}"><div id="stage"${photo ? ` style="aspect-ratio:${RATIO[key] || '4/3'}"` : ''}>${photo ? ph(0, 'p0') + ph(1, 'p1') : fig(key, 0, pkey, { arrow: 1, label: esc(e.n) + ', start position' })}</div><button class="play" id="play" aria-pressed="false">${I.play}<span>Play</span></button></div>
      ${photo ? `<p class="legend" id="phnote">The photo shows the position. Switch to Figure to see which muscles work.</p>` : `<div class="legend"><span><i style="background:var(--hot)"></i>Main muscle</span><span><i style="background:var(--hot2)"></i>Helping muscles</span><span><i class="a"></i>Movement</span></div>`}
      <div class="steps">${[0, 1].map(t => `<button class="step${t === 0 ? ' on' : ''}" data-t="${t}" aria-pressed="${t === 0}"><span class="pic">${photo ? ph(t, '') : fig(key, t, pkey)}</span><span class="cap"><span class="n">${t + 1}</span><span>${esc(e.c[t])}</span></span></button>`).join('')}</div>
    </section>`;
    o += `<section class="card target"><div class="maps">${bodyMaps(H)}</div><div><div class="eyebrow">Feel it in</div><div class="tn">${esc(T.t)}</div>${T.also ? `<div class="ta">Also works: ${esc(T.also)}</div>` : ''}<div class="ta">Needs: ${esc(e.g)}</div></div></section>`;
    o += `<section class="sec"><h2>Set by set</h2><div class="card">${setsHTML(rx, !isAlt && i === 0)}</div></section>`;
    if (own) {
      const li = (a, ic) => a.map(x => `<li>${ic}<span>${esc(x)}</span></li>`).join('');
      o += `<section class="dd"><div class="card do"><h3>Do</h3><ul>${li(own.do, I.check)}</ul></div><div class="card dont"><h3>Don't</h3><ul>${li(own.dont, I.cross)}</ul></div></section>`;
    }
    if (!isAlt) {
      o += `<section class="sec" id="alts"><h2>Equipment busy?</h2><p class="sub">Do one of these instead. Each works the same area: ${esc(P.t.toLowerCase())}.</p><div class="list">` +
        P.alt.map((a, n) => { const x = info(a); return `<button class="row ex" data-go="x-${k}-${i}-${n}"><span class="th">${fig(a, 1, pkey)}</span><span><div class="rt">${esc(x.n)}</div><div class="rm">Needs: ${esc(x.g)}</div></span>${I.chev}</button>`; }).join('') + `</div></section>`;
      const pv = i > 0 ? d.ex[i - 1][0] : null, nx = i < d.ex.length - 1 ? d.ex[i + 1][0] : null;
      o += `<nav class="pn">${pv ? `<button data-go="x-${k}-${i - 1}"><div class="k">Previous</div><div class="v">${esc(EX[pv].n)}</div></button>` : '<span></span>'}${nx ? `<button class="nx" data-go="x-${k}-${i + 1}"><div class="k">Next</div><div class="v">${esc(EX[nx].n)}</div></button>` : `<button class="nx" data-go="d-${k}"><div class="k">Finished</div><div class="v">Back to ${d.day}</div></button>`}</nav>`;
    } else {
      o += `<button class="logbtn" data-go="x-${k}-${i}">Back to ${esc(P.n)}</button>`;
    }
    return o;
  }

  let cal = null;   /* { y, m, sel } */
  function calScreen() {
    const t = today(), now = new Date();
    if (!cal) cal = { y: now.getFullYear(), m: now.getMonth(), sel: t };
    const first = new Date(cal.y, cal.m, 1), n = new Date(cal.y, cal.m + 1, 0).getDate(), lead = (first.getDay() + 6) % 7;
    const isNow = cal.y === now.getFullYear() && cal.m === now.getMonth();
    let o = `<header class="head"><div class="eyebrow">Tap a day, then pick what you did</div><h1>Gym Calendar</h1></header>`;
    o += `<div class="calhd"><button data-mon="-1" aria-label="Previous month">${I.back.replace('<svg', '<svg class="chev"')}</button><b>${MONL[cal.m]} ${cal.y}</b><button data-mon="1" aria-label="Next month"${isNow ? ' disabled' : ''}>${I.chev}</button></div>`;
    o += `<div class="cal">` + ['M', 'T', 'W', 'T', 'F', 'S', 'S'].map(x => `<span class="wd">${x}</span>`).join('');
    for (let i = 0; i < lead; i++) o += `<span class="cd blank"></span>`;
    let count = 0; const per = {};
    for (let dd = 1; dd <= n; dd++) {
      const key = dkey(new Date(cal.y, cal.m, dd)), w = log[key] && dayByKey(log[key]);
      if (w) { count++; per[w.k] = (per[w.k] || 0) + 1; }
      o += `<button class="cd${w ? ' has' : ''}${key === t ? ' now' : ''}${key === cal.sel ? ' sel' : ''}" data-sel="${key}"${key > t ? ' disabled' : ''} aria-label="${dlong(key)}${w ? ', ' + esc(w.name) : ''}"><span class="d">${dd}</span><span class="c">${w ? w.code : ''}</span></button>`;
    }
    o += `</div>`;
    const cur = log[cal.sel];
    o += `<section class="sec"><h2>${dlong(cal.sel)}${cal.sel === t ? ' · today' : ''}</h2><div class="opts">` +
      PLAN.map(d => `<button class="opt${cur === d.k ? ' on' : ''}" data-pick="${d.k}" aria-pressed="${cur === d.k}"><div class="k">${d.code}</div><div class="v">${d.name}</div></button>`).join('') + `</div>` +
      (cur ? `<button class="clear" data-pick="">Clear this day</button>` : '') + `</section>`;
    o += `<section class="sec"><h2>${MONL[cal.m]}: ${count} gym day${count === 1 ? '' : 's'}</h2>` +
      (count ? `<div class="stats">${PLAN.filter(d => per[d.k]).map(d => `<span>${d.name} <b>× ${per[d.k]}</b></span>`).join('')}</div>` : `<p class="sub">Nothing logged this month yet. Tap a day and choose the workout you did.</p>`) +
      `<p class="note" id="sync"></p></section>`;
    return o;
  }

  /* ---------- router ---------- */
  let route = 'plan';
  const scrollMem = {};
  function parse(r) {
    const p = r.split('-');
    if (p[0] === 'd' && dayByKey(p[1])) return { s: 'day', k: p[1] };
    if (p[0] === 'x' && dayByKey(p[1]) && dayByKey(p[1]).ex[+p[2]]) {
      const ai = p[3] == null ? null : +p[3];
      if (ai == null || EX[dayByKey(p[1]).ex[+p[2]][0]].alt[ai]) return { s: 'ex', k: p[1], i: +p[2], ai };
    }
    if (r === 'cal') return { s: 'cal' };
    return { s: 'plan' };
  }
  function render() {
    stopAnim();
    const r = parse(route);
    app.innerHTML = r.s === 'day' ? dayScreen(r.k) : r.s === 'ex' ? exScreen(r.k, r.i, r.ai) : r.s === 'cal' ? calScreen() : home();
    document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', (b.dataset.go === 'cal') === (r.s === 'cal')));
    if (r.s === 'cal') syncNote();
    if (r.s === 'ex') initStage();
  }
  function go(r, fromPop) {
    if (r === route) return;
    scrollMem[route] = window.scrollY;
    const depth = x => x === 'plan' || x === 'cal' ? 0 : x.split('-').length - 1;
    const back = depth(r) < depth(route);
    route = r;
    if (!fromPop) { try { history.pushState({ r }, '', '#' + r); } catch (e) { } }
    render();
    window.scrollTo(0, back && scrollMem[r] ? scrollMem[r] : 0);
  }
  window.addEventListener('popstate', ev => go((ev.state && ev.state.r) || (location.hash || '').slice(1) || 'plan', true));

  /* ---------- animated figure ---------- */
  let raf = 0, playing = false, cur = 0, playTimer = 0;
  const reduce = () => window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const ease = x => x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2;
  function stopAnim() { cancelAnimationFrame(raf); clearTimeout(playTimer); raf = 0; playing = false; }
  function initStage() { cur = 0; playing = false; }
  function draw(t) {
    const box = $('.stagebox'), st = $('#stage'); if (!box || !st) return;
    const key = box.dataset.fig, e = info(key), on = t < .5 ? 0 : 1;
    if (view === 'photo') { const a = st.querySelector('.p0'), b = st.querySelector('.p1'); if (a && b) { a.hidden = on === 1; b.hidden = on === 0; } }
    else st.innerHTML = fig(key, t, box.dataset.parent, { arrow: t === 0 ? 1 : 0, label: esc(e.n) + (t < .5 ? ', start position' : ', finish position') });
    document.querySelectorAll('.step').forEach(b => { const m = +b.dataset.t === on; b.classList.toggle('on', m); b.setAttribute('aria-pressed', m); });
  }
  function tween(to, done) {
    cancelAnimationFrame(raf);
    if (reduce() || view === 'photo') { cur = to; draw(to); if (done) done(); return; }
    const from = cur, t0 = performance.now(), dur = 650 * Math.abs(to - from) || 1;
    const step = now => {
      const x = Math.min(1, (now - t0) / dur);
      cur = from + (to - from) * ease(x); draw(x === 1 ? to : cur);
      if (x < 1) raf = requestAnimationFrame(step); else { cur = to; if (done) done(); }
    };
    raf = requestAnimationFrame(step);
  }
  function setPlay(on) {
    playing = on;
    const b = $('#play'); if (b) { b.innerHTML = (on ? I.pause : I.play) + `<span>${on ? 'Pause' : 'Play'}</span>`; b.setAttribute('aria-pressed', on); }
    if (!on) { cancelAnimationFrame(raf); clearTimeout(playTimer); return; }
    const loop = () => { if (!playing) return; tween(cur < .5 ? 1 : 0, () => { playTimer = setTimeout(loop, reduce() || view === 'photo' ? 1000 : 380); }); };
    loop();
  }

  /* ---------- events ---------- */
  document.addEventListener('click', ev => {
    const b = ev.target.closest('button'); if (!b) return;
    const ds = b.dataset;
    if (ds.go != null) return go(ds.go);
    if (ds.cal != null) { const d = dparse(ds.cal); cal = { y: d.getFullYear(), m: d.getMonth(), sel: ds.cal <= today() ? ds.cal : today() }; return go('cal'); }
    if (ds.log != null) return setLog(today(), ds.log);
    if (ds.scroll) { const el = document.getElementById(ds.scroll); if (el) el.scrollIntoView({ behavior: reduce() ? 'auto' : 'smooth', block: 'start' }); return; }
    if (ds.view) { if (ds.view === view) return; view = ds.view; try { localStorage.setItem('gym.view', view); } catch (e) { } const y = window.scrollY; render(); window.scrollTo(0, y); return; }
    if (ds.t != null) { setPlay(false); return tween(+ds.t); }
    if (b.id === 'play') return setPlay(!playing);
    if (ds.mon) { const d = new Date(cal.y, cal.m + (+ds.mon), 1); cal.y = d.getFullYear(); cal.m = d.getMonth(); return render(); }
    if (ds.sel) { cal.sel = ds.sel; return render(); }
    if (ds.pick != null) return setLog(cal.sel, log[cal.sel] === ds.pick ? '' : ds.pick);
  });

  document.addEventListener('error', ev => {
    const im = ev.target;
    if (im && im.tagName === 'IMG' && im.closest('.stagebox')) { const n = $('#phnote'); if (n) n.textContent = 'This photo did not load. Switch to Figure.'; }
  }, true);

  try { const h = (location.hash || '').slice(1); if (h) route = h; history.replaceState({ r: route }, '', '#' + route); } catch (e) { }
  render();
})();

</script>
</body></html>
